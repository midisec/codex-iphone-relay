name: Bug report
description: 报告连接、转发或界面问题
body:
  - type: markdown
    attributes:
      value: 请勿上传 API key、配对二维码、auth.json 或 bridge.json。
  - type: input
    id: environment
    attributes:
      label: 环境
      description: macOS / iOS / Xcode / App 版本
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: 连接方式
      options:
        - Type-C
        - 蓝牙
        - Type-C + 蓝牙
        - 构建或安装
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期行为与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 连接问题请注明手机是否锁屏、是否保持 App 在前台。
